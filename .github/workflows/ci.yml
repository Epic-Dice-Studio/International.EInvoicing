name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer needs the full history to derive a version

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x   # runtime only, so the net8.0 tests can execute

      - run: dotnet restore -p:TestAllTargetFrameworks=true

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:TestAllTargetFrameworks=true

      - name: Test
        run: >
          dotnet test -c Release --no-build
          -p:TestAllTargetFrameworks=true
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      # A library that claims to be trim-safe and is never trimmed stops being trim-safe quietly. Publishing
      # the sample and running it exercises every feature through a trimmed, self-contained binary.
      - name: Publish the sample trimmed, and run it
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet publish samples/International.EInvoicing.Samples -c Release -f net10.0 \
            -r linux-x64 --self-contained -p:PublishTrimmed=true -o artifacts/trimmed
          ./artifacts/trimmed/International.EInvoicing.Samples

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/**"

  crosscheck:
    name: cross-check against the KoSIT validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The reference implementation is a JVM program. This is the whole of what "needs a Java toolchain in
      # CI" amounted to.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch the reference validator and the corpus it judges
        run: |
          build/fetch-specs.sh kosit
          build/fetch-specs.sh xrechnung

      - name: Compare the two engines
        run: >
          dotnet test tests/International.EInvoicing.CrossCheck.Tests -c Release
          --logger "trx;LogFileName=crosscheck.trx"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crosscheck-results
          path: "**/TestResults/**"

  pack:
    name: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet pack -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
