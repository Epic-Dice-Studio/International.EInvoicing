name: Preview packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # NuGet trusted publishing exchanges this OIDC token for a short-lived key

# A version pushed to nuget.org can never be replaced, so two runs must not race for the same one.
concurrency:
  group: preview-packages
  cancel-in-progress: false

jobs:
  publish:
    name: pack & publish preview
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer needs the tags to work out the version

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The version is not decided here. MinVer reads it from the last tag: with v0.1.0-preview.1 tagged,
      # the commits after it publish 0.1.0-preview.1.<height>, each one ordering after the last and all of
      # them before the eventual 0.1.0. Tagging is what moves the base; this workflow only counts from it.
      - name: Where the version comes from
        run: git describe --tags --always

      - run: dotnet build -c Release

      # A preview is permanent once pushed, so it is tested before it is published rather than after.
      - run: dotnet test -c Release --no-build

      - run: dotnet pack -c Release --no-build -o artifacts

      - name: What was packed
        run: ls -1 artifacts/*.nupkg | sed 's|artifacts/||'

      # Trusted publishing rather than a stored API key — see CONTRIBUTING.md. The nuget.org policy must
      # name this workflow file as well as release.yml, or these pushes are refused.
      - name: Request a short-lived NuGet key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushed one at a time rather than by wildcard: a wildcard push reports one outcome for the whole set,
      # so a single package failing to publish is invisible. This names every one.
      - name: Push previews to NuGet.org
        run: |
          failed=0
          for package in artifacts/*.nupkg; do
            echo "::group::$(basename "$package")"
            if dotnet nuget push "$package" \
                --source https://api.nuget.org/v3/index.json \
                --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
                --skip-duplicate; then
              echo "pushed $(basename "$package")"
            else
              echo "::error::failed to push $(basename "$package")"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
