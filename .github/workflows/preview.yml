name: Preview packages

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet pack -c Release -o artifacts

      # Which packages exist is the first thing anyone asks when one is missing from the registry, and the
      # answer was previously nowhere in the log.
      - name: What was packed
        run: ls -1 artifacts/*.nupkg | sed 's|artifacts/||'

      # Pushed one at a time rather than by wildcard: a wildcard push reports one outcome for the whole set,
      # so a single package failing to publish is invisible. This names every one.
      - name: Push to GitHub Packages
        run: |
          failed=0
          for package in artifacts/*.nupkg; do
            echo "::group::$(basename "$package")"
            if dotnet nuget push "$package" \
                --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
                --api-key "${{ secrets.GITHUB_TOKEN }}" \
                --skip-duplicate; then
              echo "pushed $(basename "$package")"
            else
              echo "::error::failed to push $(basename "$package")"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
