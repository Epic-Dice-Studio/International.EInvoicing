name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: documentation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Support matrix in README matches docs/coverage.json
        run: dotnet run build/SyncCoverage.cs -- --check

      - name: Every diagnostic code has a catalogue page
        run: dotnet run build/CheckDiagnostics.cs
