name: Specification sync

# Normative artefacts move on their own schedule. This job notices before our users do.
# It only reports refs we pin by hand: whatever fetch-specs.sh tracks from master is
# already picked up by re-running the script, so it is never something to go and fix.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned refs against upstream releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report=""
          pin() { grep -oP "^$1=\"\K[^\"]+" build/fetch-specs.sh; }
          newest() { printf '%s\n' "$@" | sort -V | tail -n1; }

          # The variable is pinned in build/fetch-specs.sh; the tag is what upstream calls
          # that same release. They differ by a leading "v" for some repos, so compare bare.
          check_repo() {
            local repo="$1" variable="$2" name="$3"
            local pinned latest
            pinned="$(pin "$variable")"
            latest="$(gh release view --repo "$repo" --json tagName --jq .tagName 2>/dev/null || echo "")"
            [[ -n "$latest" && "${latest#v}" != "${pinned#v}" ]] || return 0
            report+="- **$name**: \`$variable\` pins \`$pinned\`, upstream released \`$latest\` (https://github.com/$repo/releases)"$'\n'
          }

          # The French rule sets carry no release tag of their own: phive-rules simply adds a
          # directory per DGFiP version, so the newest directory is what our pin is measured against.
          check_dir() {
            local repo="$1" path="$2" variable="$3" name="$4"
            local pinned latest
            pinned="$(pin "$variable")"
            latest="$({ gh api "repos/$repo/contents/$path" --jq '.[] | select(.type == "dir") | .name' || true; } | sort -V | tail -n1)"
            [[ -n "$latest" && "$latest" != "$pinned" && "$(newest "$pinned" "$latest")" == "$latest" ]] || return 0
            report+="- **$name**: \`$variable\` pins \`$pinned\`, phive-rules now carries \`$latest\` (https://github.com/$repo/tree/master/$path)"$'\n'
          }

          check_repo ConnectingEurope/eInvoicing-EN16931 EN16931_REF "EN 16931 validation artefacts"
          check_repo itplr-kosit/validator-configuration-xrechnung KOSIT_XRECHNUNG_CONFIG_TAG "KoSIT XRechnung validator configuration"
          check_repo itplr-kosit/validator KOSIT_VALIDATOR_VERSION "KoSIT validator"

          french=phive-rules-france/src/test/resources/external/rule-source
          check_dir phax/phive-rules "$french/ctc" FRENCH_RULES_VERSION "French CTC rules and lifecycle samples"
          check_dir phax/phive-rules "$french/flux10" FRENCH_FLUX10_VERSION "French e-reporting rules (flux 10)"

          # The DGFiP publishes its specification package as a file on impots.gouv.fr, with no feed of any
          # kind, so the only way to notice a new one is to ask for it. A newer package than the one this
          # library was measured against is a review to schedule, not a pin to bump: DGFIP_SPEC_VERSION
          # deliberately stays on v3.0 for its worked examples.
          check_dgfip() {
            local reviewed base url major minor candidate latest=""
            reviewed="$(pin DGFIP_SPEC_REVIEWED)"
            major="${reviewed#v}"; minor="${major#*.}"; major="${major%%.*}"
            base="https://www.impots.gouv.fr/sites/default/files/media/1_metier/2_professionnel/EV/2_gestion"
            base="$base/290_facturation_electronique/specification_externes_b2b"

            for candidate in "v$major.$((minor + 1))" "v$major.$((minor + 2))" "v$((major + 1)).0"; do
              url="$base/specifications-externes-$candidate.zip"
              if [[ "$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -r 0-0 "$url" || true)" =~ ^2 ]]; then
                latest="$candidate"
              fi
            done

            [[ -n "$latest" ]] || return 0
            report+="- **French DGFiP external specifications**: last reviewed against \`$reviewed\`, \`$latest\` is now published (https://www.impots.gouv.fr/specifications-externes-b2b)"$'\n'
          }

          check_dgfip

          {
            echo "report<<EOREPORT"
            printf '%s' "$report"
            echo ""
            echo "EOREPORT"
          } >> "$GITHUB_OUTPUT"

      - name: Open an issue when something moved
        if: steps.check.outputs.report != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.check.outputs.report }}
          TITLE: Upstream normative artefacts have new releases
        run: |
          set -euo pipefail

          # A weekly job must not stack a duplicate issue on top of the one nobody has closed yet.
          existing="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "Issue #$existing is already open; nothing to file."
            exit 0
          fi

          gh label create specs --color 0e8a16 --description "Normative specification artefacts" --force

          # The report carries backticks: keep it in an environment variable so the shell never expands it.
          printf '%s\n\n%s\n' \
            "$REPORT" \
            "Update the pinned refs in \`build/fetch-specs.sh\`, run it, refresh the relevant \`PROVENANCE.md\`, and run the conformance tests. Artefacts tracked from \`master\` (Peppol BIS, XRechnung Schematron, phive-rules, Mustang) need no action here, and manually published standards (Factur-X, UBL, CII) are not covered by this check. A new DGFiP package is a review to schedule rather than a pin to bump: re-read the annexes against the French model, then move \`DGFIP_SPEC_REVIEWED\`. \`DGFIP_SPEC_VERSION\` stays at v3.0 whatever happens, because later packages dropped the worked examples this repository commits." \
            > "$RUNNER_TEMP/body.md"

          gh issue create --title "$TITLE" --label specs --body-file "$RUNNER_TEMP/body.md"
