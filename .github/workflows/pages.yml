name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install DocFX
        run: dotnet tool install --global docfx

      - name: Build documentation site
        run: docfx docs/docfx.json

      - name: Build the playground
        run: dotnet publish web/Playground -c Release -o playground

      # One origin for both: the docs at /docs, the playground at /demo.
      - name: Assemble the site
        run: |
          mkdir -p docs/_site/demo
          cp -r playground/wwwroot/. docs/_site/demo/
          # The site is served from a sub-path, which the app has to know about.
          sed -i 's|<base href="/" />|<base href="/International.EInvoicing/demo/" />|' docs/_site/demo/index.html
          touch docs/_site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
