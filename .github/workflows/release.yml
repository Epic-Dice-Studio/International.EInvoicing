name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # NuGet trusted publishing exchanges this OIDC token for a short-lived key

jobs:
  publish:
    name: pack & publish
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer derives the version from the tag

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x   # runtime only, so the net8.0 tests can execute

      - run: dotnet build -c Release -p:TestAllTargetFrameworks=true
      - run: dotnet test -c Release --no-build -p:TestAllTargetFrameworks=true
      - run: dotnet pack -c Release --no-build -o artifacts

      - name: What was packed
        run: ls -1 artifacts/*.nupkg | sed 's|artifacts/||'

      # Trusted publishing rather than a stored API key: nuget.org keys now expire after 30 days, so a
      # secret would need replacing every month. This exchanges the workflow's OIDC token for a key that
      # lives about an hour. Configure the matching policy on nuget.org - see CONTRIBUTING.md.
      - name: Request a short-lived NuGet key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
